# ==========================================================
# AccessFlow - application configuration
#
# This file is COMMITTED to Git. It must never contain a
# real password. Credentials come from environment variables.
# See README.md -> "Database credentials" for setup.
# ==========================================================

spring.application.name=accessflow

# ---------- HTTP server ----------

# PORT is injected by the platform (Render, Koyeb, Heroku and most PaaS
# builders), and the container must listen on exactly that value or the platform
# routes traffic to a closed port and reports the instance as unhealthy. The 8080
# default is the local fallback and is deliberately not removed, so the
# application still starts on a laptop with nothing configured.
server.port=${PORT:8080}

# ---------- Reverse proxy / HTTPS ----------

# The platform terminates TLS and forwards the request over plain HTTP, so
# without this the application sees a plain http request: isSecure() is false,
# the session cookie is not marked Secure, and any scheme-dependent behaviour is
# wrong. `framework` makes Spring's own forwarded-header handling (the
# RemoteIpValve) apply X-Forwarded-Proto and X-Forwarded-For before anything
# else sees the request, so the application reasons about the HTTPS request the
# user actually made. Only correct behind a trusted proxy - it is what the
# platform provides.
server.forward-headers-strategy=framework

# ---------- MySQL / DataSource ----------

# The JDBC driver class. Spring Boot can usually infer this from the
# JDBC URL, so declaring it is optional but makes the dependency explicit.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC URL, built from individual environment variables so that the same
# file works on a laptop, in CI, and in production without edits.
#   ${NAME:default} -> read env var NAME, fall back to default if not set
#   ${NAME}         -> read env var NAME, no fallback (fails if missing)
#
# ACCESSFLOW_DB_URL overrides the whole URL, and PRODUCTION SETS IT. The
# database is Aiven MySQL 8.4, which requires TLS, and the composed default
# below carries useSSL=false - so the three parts are for LOCAL DEVELOPMENT and
# are not read in production. Aiven prints the exact string in its dashboard;
# copy it rather than assembling one here, so no host, port or user ends up in
# this committed file.
#
# Setting the override takes precedence over the three parts; leave it unset to
# get the composed local form, which is what a laptop and the test build use.
spring.datasource.url=${ACCESSFLOW_DB_URL:jdbc:mysql://${ACCESSFLOW_DB_HOST:localhost}:${ACCESSFLOW_DB_PORT:3306}/${ACCESSFLOW_DB_NAME:accessflow}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}

# Dedicated application user, NOT root.
spring.datasource.username=${ACCESSFLOW_DB_USER:accessflow}

# Password comes only from the environment.
# The empty default (":") is deliberate, and the effect is narrower than it
# looks: the APPLICATION still needs a credential and fails at startup without
# one (Hibernate needs JDBC metadata to pick a dialect, so it cannot get far).
# The empty default is what lets the TEST BUILD run with no database at all -
# the database-backed test classes are gated on ACCESSFLOW_DB_PASSWORD and
# report as skipped rather than failing. See README -> "Database credentials".
spring.datasource.password=${ACCESSFLOW_DB_PASSWORD:}

# ---------- Connection pool (HikariCP) ----------
# These are Spring Boot defaults already; listed here because Phase 1A
# is where the pool first exists. Remove any line equal to the default.
spring.datasource.hikari.pool-name=AccessFlowHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000

# ---------- JPA / Hibernate ----------
# update = read the existing schema, then add any missing tables/columns.
# DEVELOPMENT ONLY. It never drops or alters existing columns, so renaming a
# Java field leaves the old column behind. Production will not use this.
#
# The default is the convenient development behaviour; production sets
# ACCESSFLOW_DDL_AUTO=validate so the committed file is deployed unmodified and
# the application refuses to start against a schema that does not match the
# entities. See README.md -> "Configuration".
#
# IMPORTANT: with `update` this requires the application database user to hold
# DDL privileges (CREATE, ALTER, INDEX, REFERENCES) on the accessflow schema,
# on top of the DML privileges. See db/setup.sql section 4. Without them
# Hibernate fails to create tables, logs it only at WARN, and the app starts
# with no schema at all. `validate` needs no DDL privileges at all.
spring.jpa.hibernate.ddl-auto=${ACCESSFLOW_DDL_AUTO:update}

# Schema generation failures are logged at WARN by Hibernate, which is easy to
# miss. Raising this to ERROR makes a failed ddl-auto visible in the log
# instead of surfacing later as "Table 'accessflow.users' doesn't exist".
# Deliberately not made configurable: a quieter setting is a mistake, and a
# missing table is worth failing loudly over at any level.
logging.level.org.hibernate.tool.schema=ERROR

# Log every SQL statement Hibernate emits. DEVELOPMENT ONLY - production sets
# ACCESSFLOW_SHOW_SQL=false, again so the committed file is not edited to deploy.
# Note this logs the statements - table and column names - with `?` placeholders,
# NOT the bound values. It still belongs in a log aggregator's long-term retention
# (it reveals the shape of every query and the names of every column), and the
# `org.hibernate.SQL` logger at TRACE does log bound values, so keep that off too.
spring.jpa.show-sql=${ACCESSFLOW_SHOW_SQL:true}

# Pretty-print the logged SQL so it stays readable.
spring.jpa.properties.hibernate.format_sql=true

# Keep the persistence context open for the whole request. Disabled because
# the default (true) hides lazy-loading problems until you are in production.
spring.jpa.open-in-view=false
